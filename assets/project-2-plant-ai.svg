<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290">
<defs>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a38"/><stop offset="1" stop-color="#0b131b"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00c853"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c853" stop-opacity=".95"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".55"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="blur" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
 .float{animation:fl 4s ease-in-out infinite}
 @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
<ellipse cx="228.0" cy="274" rx="165" ry="12" fill="#000" opacity=".55" filter="url(#blur)"/>
<g class="float">
 <!-- 3D extrusion: bottom and right faces -->
 <polygon points="30,238 396,238 412,254 46,254" fill="#00c853" opacity=".75"/>
 <polygon points="396,26 412,42 412,254 396,238" fill="url(#side)"/>
 <polygon points="30,238 396,238 412,254 46,254" fill="#000" opacity=".25"/>
 <!-- front face -->
 <rect x="30" y="26" width="366" height="212" rx="16" fill="url(#face)" stroke="url(#edge)" stroke-width="2"/>
 <rect x="30" y="26" width="366" height="100" rx="16" fill="url(#gloss)"/>
 <text x="34" y="64" font-size="26" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif">🌿</text>
 <text x="72" y="62" font-size="21" font-weight="700" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif">Plant AI</text>
 <text x="72" y="81" font-size="12" fill="#00e5ff" font-family="Consolas,Menlo,monospace">Leaf Disease Prediction</text>
 <text x="34" y="150" font-size="48" font-weight="800" fill="url(#edge)" font-family="Segoe UI,Arial,sans-serif" stroke="#00e5ff" stroke-opacity=".25">90.5%</text>
 <text x="36" y="170" font-size="13" fill="#9fb3c4" font-family="Segoe UI,Arial,sans-serif">validation accuracy</text>
 <text x="36" y="196" font-size="12.5" fill="#d6e4ef" font-family="Segoe UI,Arial,sans-serif">10 classes · 3 crops · ~1 sec on CPU</text>
 <rect x="34" y="212" width="81" height="22" rx="11" fill="#ffffff" fill-opacity=".10" stroke="#00e5ff" stroke-opacity=".6"/><text x="74" y="227" text-anchor="middle" font-size="11" fill="#e8f7ff" font-family="Segoe UI,Arial,sans-serif">TensorFlow</text><rect x="121.0" y="212" width="88" height="22" rx="11" fill="#ffffff" fill-opacity=".10" stroke="#00e5ff" stroke-opacity=".6"/><text x="165" y="227" text-anchor="middle" font-size="11" fill="#e8f7ff" font-family="Segoe UI,Arial,sans-serif">InceptionV3</text><rect x="214.5" y="212" width="74" height="22" rx="11" fill="#ffffff" fill-opacity=".10" stroke="#00e5ff" stroke-opacity=".6"/><text x="252" y="227" text-anchor="middle" font-size="11" fill="#e8f7ff" font-family="Segoe UI,Arial,sans-serif">Streamlit</text><rect x="295.0" y="212" width="48" height="22" rx="11" fill="#ffffff" fill-opacity=".10" stroke="#00e5ff" stroke-opacity=".6"/><text x="319" y="227" text-anchor="middle" font-size="11" fill="#e8f7ff" font-family="Segoe UI,Arial,sans-serif">Flask</text>
</g>
</svg>