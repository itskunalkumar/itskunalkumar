<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290">
<defs>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a38"/><stop offset="1" stop-color="#0b131b"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9900"/><stop offset="1" stop-color="#ff3d71"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9900" stop-opacity=".95"/><stop offset="1" stop-color="#ff3d71" stop-opacity=".55"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="blur" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
 .float{animation:fl 4s ease-in-out infinite}
 @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
<ellipse cx="228.0" cy="274" rx="165" ry="12" fill="#000" opacity=".55" filter="url(#blur)"/>
<g class="float">
