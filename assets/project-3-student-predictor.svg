 <text x="34" y="64" font-size="26" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif">🎓</text>
 <text x="72" y="62" font-size="21" font-weight="700" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif">Student Performance</text>
