 <text x="34" y="150" font-size="48" font-weight="800" fill="url(#edge)" font-family="Segoe UI,Arial,sans-serif" stroke="#ff3d71" stroke-opacity=".25">8</text>
 <text x="36" y="170" font-size="13" fill="#9fb3c4" font-family="Segoe UI,Arial,sans-serif">regression models tuned</text>
